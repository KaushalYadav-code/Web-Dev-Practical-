<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter Application</title>
</head>
<body>
  <main class="counter-app" aria-labelledby="app-title">
    <section class="counter-card">
      <p class="eyebrow">Simple Counter</p>
      <h1 id="app-title">Counter Application</h1>

      <div class="count-display" aria-live="polite">
        <span id="count">0</span>
      </div>

      <div class="button-group" aria-label="Counter controls">
        <button id="decrement-btn" type="button">Decrement</button>
        <button id="reset-btn" type="button">Reset</button>
        <button id="increment-btn" type="button">Increment</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
